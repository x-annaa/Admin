<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>

  <!-- CSS -->
  <link rel="stylesheet" href="User/user.css">
  <link rel="stylesheet" href="Product/product.css">
  <link rel="stylesheet" href="Page3/page3.css">
  <link rel="stylesheet" href="Page4/page4.css">
  <link rel="stylesheet" href="Page5/page5.css">
  <link rel="stylesheet" href="Button/button.css">
</head>
<body>

<!-- 用户管理页面 -->
<div id="userPage" class="page active">
  <h2>👥 用户管理</h2>
  <input type="text" id="searchInput" placeholder="搜索用户名..." onkeyup="searchUsers()">
  <table id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>平台账号</th>
        <th>Coins</th>
        <th>Balance</th>
        <th>注册时间</th>
        <th>订单数</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 产品管理页面 -->
<div id="productPage" class="page">
  <h2>📦 产品管理</h2>
  <button id="addProductBtn" class="add-btn">➕ 添加产品</button>
  <table id="productsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>名称</th>
        <th>价格</th>
        <th>描述</th>
        <th>利润</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 提现管理页面 -->
<div id="page3" class="page">
  <h2>📊 提现管理</h2>
  <input type="text" id="searchWithdrawalInput" placeholder="搜索 User ID 或 Wallet Address...">
  <table id="withdrawalsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Account</th>
        <th>Amount</th>
        <th>Wallet Address</th>
        <th>Status</th>
        <th>Created At</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 页面4 -->
<div id="page4" class="page"><h2>⚙️ 页面 4</h2><p>这里暂时为空白</p></div>

<!-- 页面5: 客服聊天 -->
<div id="page5" class="page">
  <!-- 用户列表 -->
  <div id="chatUsersContainer">
    <ul id="chatUsersList"></ul>
  </div>

  <!-- 聊天窗口 -->
  <div id="adminChatWindow" class="admin-chat-window">
    <div class="admin-chat-header">
      <button id="adminBackBtn">⬅ 返回</button>
      <span id="adminChatUserInfo">用户ID: 0 - 用户名</span>
    </div>
    <div id="adminChatMessages" class="admin-chat-messages"></div>
    <div class="admin-chat-input">
      <input type="text" id="adminChatInput" placeholder="输入消息...">
      <button id="adminSendBtn">发送</button>
    </div>
  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
  <button data-page="userPage" class="active">Users</button>
  <button data-page="productPage">Products</button>
  <button data-page="page3">Withdrawals</button>
  <button data-page="page4">Page4</button>
  <button data-page="page5">Page5</button>
</div>

<!-- JS -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="User/supabaseClient.js"></script>
<script src="User/user.js"></script>
<script src="Product/product.js"></script>
<script src="Page3/page3.js"></script>
<script src="Page4/page4.js"></script>
<script src="Page5/page5.js"></script>
<script src="Button/button.js"></script>
</body>
</html>
