<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>

  <!-- CSS -->
  <link rel="stylesheet" href="User/user.css">
  <link rel="stylesheet" href="Product/product.css">
  <link rel="stylesheet" href="Page3/page3.css">
  <link rel="stylesheet" href="Page4/page4.css">
  <link rel="stylesheet" href="Page5/page5.css">
  <link rel="stylesheet" href="Button/button.css">
</head>
<body>

<!-- 用户管理页面 -->
<div id="userPage" class="page active">
  <h2>👥 用户管理</h2>
  <input type="text" id="searchInput" placeholder="搜索用户名..." onkeyup="searchUsers()">
  <table id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>平台账号</th>
        <th>Coins</th>
        <th>Balance</th>
        <th>注册时间</th>
        <th>订单数</th>
        <th>订单冷却</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 用户编辑弹窗 -->
<div id="editModal" class="modal" style="display:none;">
  <div class="modal-content">
    <p id="editUserName"></p>
    <div class="edit-actions">
      <button id="addCoinsBtn">➕ Coins</button>
      <button id="subCoinsBtn">➖ Coins</button>
      <button id="addBalanceBtn">➕ Balance</button>
      <button id="subBalanceBtn">➖ Balance</button>
      <button id="changePasswordBtn">🔑 Password</button>
      <button id="deleteUserBtn">🗑 Delete</button>
    </div>
    <button id="closeEditModal">关闭</button>
  </div>
</div>

<!-- 手动匹配产品弹窗 -->
<div id="ruleModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 id="ruleUserName">手动匹配产品</h3>
    <label>第几单: <input type="number" id="ruleOrderNumber" min="1"></label><br>
    <label>产品ID: <input type="number" id="ruleProductId" min="1"></label><br>
    <label><input type="checkbox" id="ruleEnabled" checked> 开启规则</label>
    <div class="modal-actions">
      <button id="saveRuleBtn">确认匹配</button>
      <button id="closeRuleModal">取消</button>
    </div>
  </div>
</div>

<!-- 产品管理页面 -->
<div id="productPage" class="page">
  <h2>📦 产品管理</h2>
  <button id="addProductBtn" class="add-btn">➕ 添加产品</button>
  <table id="productsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>名称</th>
        <th>价格</th>
        <th>描述</th>
        <th>利润</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 编辑/添加产品弹窗 -->
<div id="productModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 id="productModalTitle">编辑产品</h3>
    <label>名称: <input type="text" id="editName"></label><br>
    <label>价格: <input type="number" id="editPrice"></label><br>
    <label>描述: <input type="text" id="editDescription"></label><br>
    <label>利润: <input type="number" id="editProfit"></label><br>
    <div class="modal-actions">
      <button id="saveProductBtn">保存</button>
      <button id="deleteProductBtn">删除</button>
      <button id="closeProductModal">取消</button>
    </div>
  </div>
</div>

<!-- 匹配设置弹窗 -->
<div id="productMatchModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>产品匹配设置</h3>
    <label><input type="checkbox" id="productEnabledCheckbox" checked> 开启匹配</label><br>
    <label><input type="checkbox" id="productManualOnlyCheckbox"> 手动专属</label><br>
    <div class="modal-actions">
      <button id="saveProductMatchBtn">确认保存</button>
      <button id="closeProductMatchModal">取消</button>
    </div>
  </div>
</div>

<!-- 提现管理页面 (Page3) -->
<div id="page3" class="page">
  <h2>📊 提现管理</h2>
  <input type="text" id="searchWithdrawalInput" placeholder="搜索 User ID 或 Wallet Address...">
  <table id="withdrawalsTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Account</th>
        <th>Amount</th>
        <th>Wallet Address</th>
        <th>Status</th>
        <th>Created At</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 充值管理页面 (Page4) -->
<div id="page4" class="page">
  <h2>💰 充值管理</h2>
  <input type="text" id="searchRechargeInput" placeholder="搜索用户名或平台账号">
  <table id="rechargesTable">
    <thead>
      <tr>
        <th>用户名</th>
        <th>平台账号</th>
        <th>金额</th>
        <th>截图</th>
        <th>状态</th>
        <th>创建时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>



<!-- 页面5: 客服聊天 -->



<!-- 底部导航 -->
<div class="bottom-nav">
  <button data-page="userPage" class="active">Users</button>
  <button data-page="productPage">Products</button>
  <button data-page="page3">Withdrawals</button>
  <button data-page="page4">Page4</button>
  <button data-page="page5" style="position: relative;">
    Page5
    <span id="page5Unread" class="unread-dot hidden"></span>
  </button>
</div>

<!-- JS -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="User/supabaseClient.js"></script>
<script src="User/user.js"></script>
<script src="Product/product.js"></script>
<script src="Page3/page3.js"></script>
<script src="Page4/page4.js"></script>
<script src="Page5/page5.js"></script>
<script src="Button/button.js"></script>
</body>
</html>
