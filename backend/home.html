<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="stylesheet" href="User/user.css">
  <link rel="stylesheet" href="Product/product.css">
  <link rel="stylesheet" href="Page3/page3.css">
  <link rel="stylesheet" href="Page4/page4.css">
  <link rel="stylesheet" href="Page5/page5.css">
  <link rel="stylesheet" href="Button/button.css">
</head>
<body>

<!-- 产品管理页面 -->
<div id="productPage" class="page">
  <h2>📦 产品管理</h2>
  <div style="margin-bottom:10px;">
    <button id="addProductBtn" class="add-btn">➕ 添加产品</button>
  </div>
  <table id="productsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>名称</th>
        <th>价格</th>
        <th>描述</th>
        <th>利润</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 编辑/添加产品弹窗 -->
<div id="productModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 id="productModalTitle">编辑产品</h3>
    <label>名称: <input type="text" id="editName"></label><br>
    <label>价格: <input type="number" id="editPrice"></label><br>
    <label>描述: <input type="text" id="editDescription"></label><br>
    <label>利润: <input type="number" id="editProfit"></label><br>
    <div class="modal-actions">
      <button id="saveProductBtn">保存</button>
      <button id="deleteProductBtn">删除</button>
      <button id="closeProductModal">取消</button>
    </div>
  </div>
</div>

<!-- 匹配设置弹窗 -->
<div id="productMatchModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>产品匹配设置</h3>
    <label><input type="checkbox" id="productEnabledCheckbox" checked> 开启匹配</label><br>
    <label><input type="checkbox" id="productManualOnlyCheckbox"> 手动专属</label><br>
    <div class="modal-actions">
      <button id="saveProductMatchBtn">确认保存</button>
      <button id="closeProductMatchModal">取消</button>
    </div>
  </div>
</div>

<!-- 产品规则弹窗 -->
<div id="productRuleModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>产品规则设置</h3>
    <label>最大订单数: <input type="number" id="productMaxOrders" min="1"></label><br>
    <label>周期分钟数: <input type="number" id="productPeriodMinutes" min="1"></label><br>
    <div class="modal-actions">
      <button id="saveProductRuleBtn">保存</button>
      <button id="closeProductRuleModal">取消</button>
    </div>
  </div>
</div>

<!-- JS -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="User/supabaseClient.js"></script>
<script src="Product/product.js"></script>
</body>
</html>
