<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>

  <!-- CSS -->
  <link rel="stylesheet" href="User/user.css">
  <link rel="stylesheet" href="Product/product.css">
  <link rel="stylesheet" href="WD/wd.css">
  <link rel="stylesheet" href="Page5/page5.css">
  <link rel="stylesheet" href="Button/button.css">
</head>
<body>

<!-- 用户管理页面 -->
<div id="userPage" class="page active">
  <h2>👥 用户管理</h2>
  <input type="text" id="searchInput" placeholder="搜索用户名..." onkeyup="searchUsers()">
  <table id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>用户名</th>
        <th>平台账号</th>
        <th>Coins</th>
        <th>Balance</th>
        <th>注册时间</th>
        <th>订单数</th>
        <th>注册IP</th>
        <th>订单冷却</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 用户编辑弹窗 -->
<div id="editModal" class="modal" style="display:none;">
  <div class="modal-content">
    <p id="editUserName"></p>
    <div class="edit-actions">
      <button id="addCoinsBtn">➕ Coins</button>
      <button id="subCoinsBtn">➖ Coins</button>
      <button id="addBalanceBtn">➕ Balance</button>
      <button id="subBalanceBtn">➖ Balance</button>
      <button id="changePasswordBtn">🔑 Password</button>
      <button id="deleteUserBtn">🗑 Delete</button>
    </div>
    <button id="closeEditModal">关闭</button>
  </div>
</div>

<!-- 手动匹配产品弹窗 -->
<div id="ruleModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 id="ruleUserName">手动匹配产品</h3>
    <label>第几单: <input type="number" id="ruleOrderNumber" min="1"></label><br>
    <label>产品ID: <input type="number" id="ruleProductId" min="1"></label><br>
    <label><input type="checkbox" id="ruleEnabled" checked> 开启规则</label>
    <div class="modal-actions">
      <button id="saveRuleBtn">确认匹配</button>
      <button id="closeRuleModal">取消</button>
    </div>
  </div>
</div>

<!-- 产品管理页面 -->
<div id="productPage" class="page">
  <h2>🛍 产品管理</h2>
  <input type="text" id="searchProductInput" placeholder="搜索产品名..." onkeyup="searchProducts()">
  <button id="addProductBtn">➕ 添加新产品</button>

  <table id="productsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>名称</th>
        <th>价格</th>
        <th>描述</th>
        <th>Profit</th>
        <th>E</th>
        <th>A</th>
        <th>URL</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- 编辑产品弹窗 -->
<div id="editProductModal" class="product-modal" style="display:none;">
  <div class="product-modal-content">
    <h3>编辑产品</h3>
    <input type="hidden" id="editProductId">
    <label>名称: <input type="text" id="editProductName"></label><br>
    <label>价格: <input type="number" id="editProductPrice" step="0.01"></label><br>
    <label>描述: <textarea id="editProductDescription"></textarea></label><br>
    <label>Profit: <input type="number" id="editProductProfit" step="0.01"></label><br>
    <label>Enabled: <input type="checkbox" id="editProductEnabled"></label><br>
    <label>Manual Only: <input type="checkbox" id="editProductManualOnly"></label><br>
    <label>URL: <input type="text" id="editProductUrl"></label><br>
    <button id="saveProductBtn">保存</button>
    <button id="closeEditProductModal">取消</button>
  </div>
</div>


<!-- 提现管理页面 (Page3) -->
<div id="button3" class="page">
</div>

<!-- =========================
     W-D 页面
========================= -->

<div id="wdPage" class="page">

  <!-- 固定顶部 -->
  <div class="wd-header">

    <button
      id="wdWithdrawTab"
      class="wd-tab active">
      提现
    </button>

    <span class="wd-tab-divider">|</span>

    <button
      id="wdDepositTab"
      class="wd-tab">
      充值
    </button>

  </div>


  <!-- =========================
       提现
  ========================= -->

  <div
    id="wdWithdrawContent"
    class="wd-content active">

    <div class="wd-search-box">

      <input
        type="text"
        id="searchWithdrawalInput"
        placeholder="搜索 User ID 或 Wallet Address..."
      >

    </div>


    <div class="wd-table-wrapper">

      <table id="withdrawalsTable">

        <thead>
          <tr>
            <th>Name</th>
            <th>Account</th>
            <th>Amount</th>
            <th>Wallet Address</th>
            <th>Status</th>
            <th>Created At</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </div>


  <!-- =========================
       充值
  ========================= -->

  <div
    id="wdDepositContent"
    class="wd-content">

    <div class="wd-search-box">

      <input
        type="text"
        id="searchRechargeInput"
        placeholder="搜索用户名或平台账号"
      >

    </div>


    <div class="wd-table-wrapper">

      <table id="rechargesTable">

        <thead>
          <tr>
            <th>用户名</th>
            <th>平台账号</th>
            <th>金额</th>
            <th>截图</th>
            <th>状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>

        <tbody></tbody>

      </table>

    </div>

  </div>

</div>

<!-- 页面5: 客服聊天 -->
<!-- Page5 -->

<div id="page5" class="page">

<div id="page5AdminUserList">

</div>



<!-- Inbox -->

<div id="page5AdminInboxModal"
     class="page5-admin-modal">


    <div class="page5-admin-modal-box">



        <h3>
            Send Inbox
        </h3>



        <!-- 当前用户 -->

        <div
        id="page5InboxUserName"
        class="page5-inbox-user-name">
        </div>





        <!-- =====================
             Inbox History
        ====================== -->


        <div class="page5-inbox-history">

            <div
            id="page5InboxHistory"
            class="page5-inbox-history-list">


                Loading...


            </div>


        </div>








        <!-- =====================
             New Inbox
        ====================== -->


        <div class="page5-inbox-send">


            <input
            id="page5InboxTitle"
            type="text"
            placeholder="Title">





            <textarea
            id="page5InboxContent"
            placeholder="Message"
            rows="5"></textarea>



        </div>






        <!-- =====================
             Buttons
        ====================== -->


        <div class="page5-admin-modal-buttons">


            <button
            id="page5SendInboxBtn">

                Send

            </button>



            <button
            id="page5CloseInboxBtn">

                Close

            </button>



        </div>



    </div>


</div>



<!-- Chat -->


<div id="page5AdminChatModal"
     class="page5-admin-modal">


    <div class="page5-admin-modal-box page5-chat-box">


        <h3 id="page5ChatUserTitle">
        </h3>


        <div id="page5AdminChatMessages">

        </div>



        <textarea
        id="page5AdminChatInput"
        placeholder="Message">
        </textarea>



        <button id="page5AdminSendChatBtn">
        Send
        </button>



        <button id="page5CloseChatBtn">
        Close
        </button>


    </div>


</div>


</div>


<!-- 底部导航 -->
<div class="bottom-nav">

  <button
    data-page="userPage"
    class="active">
    Users
  </button>

  <button
    data-page="productPage">
    Products
  </button>

  <button
    data-page="button3">
    Button 3
  </button>

  <button data-page="wdPage" style="position: relative;">
    W-D
    <span id="wdUnread" class="wd-unread-badge hidden">0</span>
  </button>

    <button
      data-page="page5"
      style="position:relative;">
      Chat
      <span
        id="page5Unread"
        class="unread-dot hidden">
      </span>
    </button>

</div>

<!-- JS -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="User/supabaseClient.js"></script>
<script src="User/user.js"></script>
<script src="Product/product.js"></script>
<script src="WD/wd.js"></script>
<script src="Page5/page5.js"></script>
<script src="Button/button.js"></script>
</body>
</html>
