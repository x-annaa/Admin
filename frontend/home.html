<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按钮切换页面</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- 页面内容 -->
  <div id="page1" class="page active">📄 这是按钮1的页面</div>
  <div id="page2" class="page">📄 这是按钮2的页面</div>
  <div id="page3" class="page">📄 这是按钮3的页面</div>
  <div id="page4" class="page">📄 这是按钮4的页面</div>
  <div id="page5" class="page">📄 这是按钮5的页面</div>

  <!-- 底部按钮 -->
  <div class="bottom-nav">
    <button data-page="page1" class="active">按钮1</button>
    <button data-page="page2">按钮2</button>
    <button data-page="page3">按钮3</button>
    <button data-page="page4">按钮4</button>
    <button data-page="page5">按钮5</button>
  </div>

  <script src="hoem.js"></script>
</body>
</html>
