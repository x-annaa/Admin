<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <h1>Admin Panel</h1>

  <!-- 管理员登录 -->
  <div id="loginSection">
    <input type="password" id="adminPassword" placeholder="Enter admin password">
    <button onclick="checkAdmin()">Login</button>
  </div>

  <!-- 后台管理区 -->
  <div id="adminSection" style="display:none;">
    <!-- 顶部工具栏 -->
    <div style="text-align:right; margin-bottom:10px;">
      <button onclick="refreshPage()">🔄 Refresh</button>
    </div>

    <!-- 页面区 -->
    <div id="pageContent"></div>
  </div>

  <!-- 底部导航栏 -->
  <div id="bottomNav" class="bottom-nav" style="display:none;">
    <button onclick="switchPage('users')">USER</button>
    <button onclick="switchPage('products')">Product</button>
    <button onclick="switchPage('btn1')">按钮1</button>
    <button onclick="switchPage('btn2')">按钮2</button>
    <button onclick="switchPage('btn3')">按钮3</button>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script src="admin.js"></script>
</body>
</html>
